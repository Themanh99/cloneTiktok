groups:
  - name: local-lab-health
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} has been down for more than 1 minute."

      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_queue_messages_ready > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue backlog is growing"
          description: "Queue {{ $labels.queue }} has more than 100 ready messages."
